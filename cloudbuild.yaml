# Cloud Build configuration for deploying to Google Cloud Run
# Usage: gcloud builds submit --config=cloudbuild.yaml

steps:
  # Step 1: Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME', '.']

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_SERVICE_NAME'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Uncomment below to set environment variables for database connection
      # - '--set-env-vars'
      # - 'DB_HOST=${_DB_HOST},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME}'
      # Uncomment below to set memory and CPU
      # - '--memory'
      # - '${_MEMORY}'
      # - '--cpu'
      # - '${_CPU}'

# Substitutions for customization
# These can be overridden during build submission with --substitutions
substitutions:
  _REGION: us-central1
  _REPOSITORY: hospital-app-repo
  _SERVICE_NAME: hospital-appointment-system
  # Database configuration (optional - can also use Secret Manager)
  _DB_HOST: localhost
  _DB_USER: root
  _DB_PASS: ''
  _DB_NAME: hc
  # Resource configuration
  _MEMORY: 512Mi
  _CPU: '1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  timeout: 1200s
